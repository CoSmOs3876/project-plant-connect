<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal de Culture - PlantConnect</title>
    <link rel="stylesheet" href="journal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <i class="fas fa-leaf"></i>
                <span>PlantConnect</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="encyclopedie.html">Encyclopedie</a></li>
                <li><a href="journal.html">Journal</a></li>
                <li><a href="forum.html">Forum</a></li>
            </ul>
        </div>
    </nav>

    <main class="container" style="padding: 4rem 0;">
        <section class="feature-card">
            <h2>Journal de Culture</h2>
            <form action="#" method="post">
                <div>
                    <label for="nom">Nom du jardinier :</label>
                    <input type="text" id="nom" name="nom" required>
                </div>
                <div>
                    <label for="email">Email :</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="date">Date de plantation :</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <div>
                    <label for="notes">Notes de culture :</label>
                    <textarea id="notes" name="notes" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn-primary">Enregistrer</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; Abderrahmane et Mohamed Ali
        </div>
    </footer>
</body>
</html>
